spring:
  datasource:
    # Each test class overrides this via @DynamicPropertySource with a unique temporary SQLite file.
    url: jdbc:sqlite:target/mall-test.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          use_get_generated_keys: false
        id:
          new_generator_mappings: true

logging:
  level:
    org.hibernate: WARN
    org.springframework.web: WARN
    com.example: INFO
